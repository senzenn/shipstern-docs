# Own workspace, kept apart from ../Cargo.toml so its dependency features do
# not unify into the other examples.
[workspace]

[package]
name = "stream-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
prost = { version = "0.14", features = ["derive"] }
rustls = "0.23"
shipstern-core = "0.13.0"
shipstern-stream = "0.13.0"
shipstern-yellowstone-grpc-source = "0.13.0"
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
